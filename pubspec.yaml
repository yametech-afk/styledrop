name: styledrop
description: "StyleDrop — Your AI Wardrobe Stylist"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (authentication)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.5

  # Firebase (cloud sync)
  cloud_firestore: ^5.4.4

  # State management
  provider: 6.1.5+1

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: ^2.1.4

  # Media & images
  image_picker: ^1.1.2

  # Networking
  http: 1.5.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  table_calendar: ^3.1.2
  permission_handler: ^11.3.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^20.1.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^0.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/logo.png
    - assets/icon/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/logo.png
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: assets/icon/logo.png

flutter_native_splash:
  color: "#F5F0E8"
  image: assets/icon/splash.png
  android_12:
    color: "#F5F0E8"
    image: assets/icon/splash.png
