name: Build Android APK (StyleDrop)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Flutter pub get
        working-directory: styledrop
        run: flutter pub get

      - name: Build release APK
        working-directory: styledrop
        run: |
          flutter build apk --release \
            --dart-define=PROXY_BASE_URL=https://styledrop-proxy.pages.dev \
            --dart-define=APP_SHARED_SECRET=

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: styledrop-release-apk
          path: styledrop/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
