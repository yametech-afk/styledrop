name: Build Android App Bundle (StyleDrop)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Pre-download Gradle wrapper
        run: |
          cd android
          for i in 1 2 3; do
            ./gradlew --version && break || sleep 15
          done

      # Optional: restore the upload keystore + key.properties from repo
      # secrets so CI produces a SIGNED .aab ready for the Play Console.
      # If the secrets are absent, the build still succeeds and falls back
      # to the debug key (fine for smoke-testing, NOT for Play uploads).
      #
      # Required secrets (repo Settings → Secrets and variables → Actions):
      #   ANDROID_UPLOAD_KEY_BASE64  — base64 of styledrop-upload.jks
      #                                (create with: base64 -w0 styledrop-upload.jks)
      #   KEYSTORE_PASSWORD          — storePassword
      #   KEY_PASSWORD               — keyPassword
      #   KEY_ALIAS                  — keyAlias (e.g. "upload")
      - name: Restore upload keystore from secrets
        env:
          ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEY_BASE64" ]; then
            echo "No keystore secret set — release AAB will use the debug key."
            exit 0
          fi
          echo "$ANDROID_UPLOAD_KEY_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "Keystore restored — release AAB will be signed."

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      # Play Store requires an Android App Bundle (.aab) for new apps.
      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=PROXY_BASE_URL=https://styledrop-proxy.pages.dev \
            --dart-define=APP_SHARED_SECRET=

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: styledrop-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
