name: Build Android APK (StyleDrop)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Pre-download Gradle wrapper
        run: |
          cd android
          for i in 1 2 3; do
            ./gradlew --version && break || sleep 15
          done

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=PROXY_BASE_URL=https://styledrop-proxy.pages.dev \
            --dart-define=APP_SHARED_SECRET=

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: styledrop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
